name: CI/CD Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Spin up Redis and Neo4j just like Docker Compose does locally
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/password123
        ports:
          - 7687:7687
          - 7474:7474

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx black
    
    - name: Check code formatting
      run: black --check .
    
    - name: Run tests
      run: PYTHONPATH=. pytest tests/ -v
      env:
        NEO4J_URI: neo4j://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: password123
        REDIS_URL: redis://localhost:6379
        JWT_SECRET_KEY: super-secret-fraud-shield-key-2026
        JWT_ALGORITHM: HS256
        TELEGRAM_BOT_TOKEN: dummy-token
        TELEGRAM_CHAT_ID: "123456"